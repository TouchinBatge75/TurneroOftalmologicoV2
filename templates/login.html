<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnero | Acceso central</title>
  <style>
    :root{font-family:'Segoe UI',Arial,sans-serif;color-scheme:light;--nav:#142b38;--gold:#c6a773;--ink:#1e2c34;--muted:#697781}
    *{box-sizing:border-box}body{margin:0;background:#f4f5f4;color:var(--ink)}
    main{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(350px,460px)}
    .visual{background:linear-gradient(140deg,#172e3c,#0b202c);color:white;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(30px,6vw,85px);position:relative;overflow:hidden}
    .visual:after{content:'';position:absolute;width:370px;height:370px;border:1px solid #d5b77c50;border-radius:50%;right:-140px;top:25%;box-shadow:0 0 0 60px #ffffff06,0 0 0 130px #ffffff04;pointer-events:none}
    .brand{display:flex;align-items:center;gap:14px;font-size:18px;letter-spacing:.4px}.mark{border:1px solid #c6a773;color:#e6c995;padding:12px 10px;font-family:Georgia,serif;font-size:20px}
    h1{font:normal clamp(40px,5vw,68px)/1.12 Georgia,serif;max-width:630px;position:relative;z-index:1}h1 em{color:#d6bd91;font-weight:normal}
    .foot{color:#b7c5cc;font-size:12px}.panel{display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,5vw,65px);background:#fff}
    .eyebrow{text-transform:uppercase;letter-spacing:2px;color:#a58859;font-size:11px;font-weight:bold}h2{font:normal 36px Georgia,serif;margin:17px 0 8px}
    .hint{color:var(--muted);line-height:1.6;font-size:13px;margin-bottom:30px}label{display:block;font-size:12px;font-weight:650;margin:17px 0 8px}
    input{width:100%;font-size:14px;padding:13px 12px;border:1px solid #dbe1e1;border-radius:5px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c6a77320}
    button{width:100%;margin-top:26px;border:0;border-radius:5px;padding:14px;background:var(--nav);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    #error{margin-top:18px;color:#a55351;background:#faebea;padding:12px;border-radius:5px;font-size:12px;line-height:1.6}#error[hidden]{display:none}
    @media(max-width:780px){main{grid-template-columns:1fr}.visual{min-height:240px;padding:26px}.visual h1{font-size:40px;margin:25px 0}.panel{padding:35px 25px}}
  </style>
</head>
<body>
  <main>
    <section class="visual">
      <div class="brand"><span class="mark">TR</span><span>Turnero <small style="display:block;color:#c8c2b7;font-size:10px;letter-spacing:1.6px;margin-top:4px">ACCESO INSTITUCIONAL</small></span></div>
      <h1>Una sola entrada.<br><em>Tu área de trabajo.</em></h1>
      <div class="foot">Sistema de gestión de turnos · Uso interno</div>
    </section>
    <section class="panel">
      <div class="eyebrow">Acceso de operadores</div>
      <h2>Iniciar sesión</h2>
      <p class="hint">Ingresa tus credenciales. El sistema abrirá únicamente una pantalla a la que tengas acceso.</p>
      <form id="loginForm">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" autocomplete="username" maxlength="80" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">Entrar al Turnero</button>
        <div id="error" role="alert" hidden></div>
      </form>
    </section>
  </main>
  <script>
    (()=>{
      'use strict';
      const form=document.getElementById('loginForm');
      const error=document.getElementById('error');
      const button=document.getElementById('submit');
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        error.hidden=true;button.disabled=true;
        try{
          const tokenResponse=await fetch('/csrf-token',{credentials:'same-origin',cache:'no-store'});
          if(!tokenResponse.ok)throw new Error('No fue posible iniciar el proceso de autenticación.');
          const tokenData=await tokenResponse.json();
          if(!tokenData.csrf_token)throw new Error('Token de seguridad no disponible.');
          const response=await fetch('/auth/login',{
            method:'POST',credentials:'same-origin',
            headers:{'Content-Type':'application/json','X-CSRFToken':tokenData.csrf_token},
            body:JSON.stringify({usuario:document.getElementById('usuario').value.trim(),password:document.getElementById('password').value})
          });
          const data=await response.json().catch(()=>({}));
          if(!response.ok||data.success===false)throw new Error(data.error||data.message||'No se pudo iniciar sesión.');
          document.getElementById('password').value='';
          window.location.replace('/mi-panel');
        }catch(e){error.textContent=e.message||'Error de conexión.';error.hidden=false;}
        finally{button.disabled=false;}
      });
    })();
  </script>
</body>
</html>
